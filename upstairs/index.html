<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html,body{background:#15101a;color:#f0e7dc;color-scheme:dark;margin:0}</style>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KP Upstairs</title>
<meta name="description" content="the paid floor of the reading room. programs you use, not pdfs you forget.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15101a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KP Upstairs">
<link rel="manifest" href="/upstairs/manifest.webmanifest">
<link rel="apple-touch-icon" href="/upstairs/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/upstairs/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
<style>
/* KP Unfiltered · upstairs. same world as the reading room: a room at 2am, torn paper on top.
   Candle gold marks the paid floor. Each product has its own accent (detox = rose). */
:root{
  color-scheme:dark;
  --night:#15101a;--night-2:#1d1623;--night-3:#271d2d;--line:#3a2c40;--line-soft:#2a2030;
  --text:#f0e7dc;--dim:#b9a9b4;--faint:#948290;
  --paper:#efe4d3;--paper-2:#e4d5bf;--paper-ink:#2a1c23;--paper-dim:#6e5762;
  --rose:#e27592;--rose-soft:rgba(226,117,146,.14);--wine:#8a2846;
  --candle:#eab861;--candle-soft:rgba(234,184,97,.14);
  --sage:#8fc1a0;--slate:#a3b5d8;--amber:#dc9d55;
  --pc:var(--rose);
  --display:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;
  --serif:"Fraunces","Iowan Old Style",Georgia,serif;
  --body:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --gut:18px;--appw:600px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --edge:0px; /* iphone home-screen app: iOS blurs a band under the clock, so tops sit below it */
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .24 0 0 0 0 .18 0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*,*::before,*::after{box-sizing:border-box}
html.ios-app{--edge:22px}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(80px + var(--edge));scroll-padding-bottom:120px}
body{margin:0;min-height:100vh;background-color:var(--night);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 80% 40% at 10% -10%,rgba(234,184,97,.12),transparent 70%),radial-gradient(ellipse 60% 40% at 100% 0%,rgba(226,117,146,.08),transparent 70%);background-repeat:no-repeat;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
a{color:inherit}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit}
:focus-visible{outline:2px solid var(--candle);outline-offset:3px;border-radius:3px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:var(--appw);margin-inline:auto;padding-inline:var(--gut)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.eyebrow b{color:var(--candle)}
.display{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:.86;text-transform:uppercase}
.paper{background-color:var(--paper);background-image:var(--grain);color:var(--paper-ink);position:relative}
.paper .muted{color:var(--paper-dim)}
.hand{font-family:var(--hand);font-weight:600;line-height:1.15}
.serif{font-family:var(--serif)}
.dim{color:var(--dim)}.faint{color:var(--faint)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:40px;padding:14px 22px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s ease,background .15s ease,opacity .15s;min-height:48px}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn-pc{background:var(--pc);color:#1c0f15}
.btn-candle{background:var(--candle);color:#241808}
.btn-ghost{border-color:var(--line);background:transparent;color:var(--text)}
.btn-ink{background:var(--paper-ink);color:var(--paper)}
.btn-line{border:1px solid rgba(42,28,35,.3);color:var(--paper-ink);background:transparent}
.btn-block{width:100%}
.linkish{background:none;border:none;padding:0;cursor:pointer;color:var(--dim);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.paper .linkish{color:var(--paper-dim)}

/* masthead */
.mast{position:sticky;top:0;z-index:30;padding-top:calc(var(--safe-t) + 4px + var(--edge));background:var(--night);border-bottom:1px solid var(--line-soft)}
.mast-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px}
.wordmark{display:inline-flex;align-items:baseline;gap:7px;text-decoration:none}
.wordmark .kp{font-family:var(--display);font-size:23px;letter-spacing:.04em;line-height:1}
.wordmark .un{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--candle)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--dim)}
.iconbtn svg{width:18px;height:18px}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line);border-radius:30px;padding:5px 11px;text-decoration:none;white-space:nowrap}

/* ============ SHELF ============ */
.shelf-hero{padding:34px 0 8px;overflow-x:clip}
.shelf-hero h1{font-size:clamp(84px,24vw,150px);color:var(--candle);margin-top:10px}
.shelf-hero .lede{font-family:var(--serif);font-size:20px;line-height:1.45;margin-top:14px;max-width:32ch}
.shelf-hero .lede em{color:var(--candle)}
.floors{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:var(--faint)}
.floors span{border:1px solid var(--line);border-radius:30px;padding:4px 10px}
.floors span.on{border-color:var(--candle);color:var(--candle)}
.sec{margin-top:40px}
.sec-h{margin-bottom:14px;display:flex;flex-direction:column;gap:4px}
.sec-h h2{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.1}
.sec-h p{color:var(--dim);font-size:14.5px}

.keycard{padding:26px 22px 24px;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.keycard h2{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15}
.keycard p{font-size:14.5px;margin-top:6px}
.form{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.form input[type=text],.form input[type=email],.form input[type=tel]{width:100%;border:1px solid rgba(42,28,35,.25);background:#fbf6ee;border-radius:40px;padding:14px 18px;font-size:16px;color:var(--paper-ink)}
.form input::placeholder{color:#94818a}
.form input.key{font-family:var(--display);font-size:22px;letter-spacing:.14em;text-transform:uppercase;padding:12px 18px}
.form .err{font-size:13.5px;color:var(--wine);min-height:0;font-weight:600}
.form .fine{font-size:12px;color:var(--paper-dim);line-height:1.5}
.junkhint{margin:14px 0 4px;padding:12px 14px;border-radius:6px;background:rgba(138,40,70,.09);border-left:3px solid var(--wine,#8a2846);font-size:14px;line-height:1.5;color:var(--paper-ink)}
.junkhint b{font-weight:800}
.tick{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--paper-ink);cursor:pointer;line-height:1.4}
.tick input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border:1.5px solid var(--paper-dim);border-radius:5px;margin:0;display:grid;place-items:center;cursor:pointer;background:#fbf6ee}
.tick input:checked{background:var(--paper-ink);border-color:var(--paper-ink)}
.tick input:checked::after{content:"";width:5px;height:10px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.codebox{font-family:var(--display);font-size:34px!important;letter-spacing:.4em;text-align:center}

.prod{border:1px solid var(--line);border-radius:6px;background:var(--night-2);padding:20px 18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;text-decoration:none}
.prod + .prod{margin-top:12px}
.prod .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prod h3{font-family:var(--display);font-size:34px;line-height:.92;letter-spacing:.02em;color:var(--c,var(--text))}
.prod p{font-size:14px;color:var(--dim)}
.prod .status{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.prod .status.open{color:var(--sage)}
.prod .status.open::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 4px rgba(143,193,160,.18)}
.prod.mine{border-color:var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,var(--night-2)),var(--night-2) 60%)}
.prod.locked h3{opacity:.55}
.prod.locked::after{content:"";position:absolute;right:-8px;bottom:-14px;width:90px;height:90px;background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233a2c40' stroke-width='1.6'><rect x='5' y='11' width='14' height='10' rx='2'/><path d='M8 11V8a4 4 0 0 1 8 0v3'/></svg>");opacity:.9}
.prod .bar{height:6px;border-radius:6px;background:var(--night-3);overflow:hidden;margin-top:4px}
.prod .bar i{display:block;height:100%;background:var(--c);border-radius:6px}
.prod .row{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.secret-tease{margin-top:40px;border:1px dashed var(--line);border-radius:6px;padding:22px 18px}
.secret-tease .display{font-size:40px;color:var(--candle)}
.secret-tease p{color:var(--dim);font-size:14.5px;margin-top:6px}
.secret-tease .s-note{font-size:13px;color:var(--faint);font-style:italic}
.secret-tease .s-in{color:var(--text);font-weight:600;margin-top:12px}
.secret-tease .s-in em{color:var(--candle);font-weight:400}

/* ============ APP ============ */
.app{padding-bottom:calc(var(--safe-b) + 96px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:var(--safe-b);background:rgba(21,16,26,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line-soft)}
.tabbar-in{max-width:var(--appw);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:64px}
.tab{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);padding:8px 0 10px;text-decoration:none}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] svg{color:var(--pc)}
.sosbtn{justify-self:center;width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;margin-bottom:12px;background:radial-gradient(circle at 35% 30%,#f39ab1,var(--rose) 45%,var(--wine));color:#200c14;font-family:var(--display);font-size:21px;letter-spacing:.06em;box-shadow:0 0 0 6px rgba(226,117,146,.16),0 10px 24px rgba(0,0,0,.5)}

.greet{padding:24px 0 4px}
.greet .eyebrow{color:var(--pc)}
.greet h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin-top:6px}
.greet h1 em{font-style:italic;color:var(--pc);font-weight:400}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#241808;background:var(--candle);border-radius:30px;padding:3px 9px;margin-left:6px;vertical-align:3px}

.streak{margin-top:18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:18px;background:var(--night-2)}
.ring{position:relative;width:108px;height:108px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-n{font-family:var(--display);font-size:52px;line-height:.8;color:var(--candle);font-variant-numeric:tabular-nums}
.ring-l{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.streak h3{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25}
.streak p{font-size:13.5px;color:var(--dim);margin-top:4px}
.streak .row{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}

.today{margin-top:14px;padding:24px 20px 22px;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.today .eyebrow{color:var(--paper-dim)}
.today .eyebrow b{color:var(--wine)}
.today h2{font-family:var(--display);font-size:clamp(48px,14vw,68px);line-height:.88;margin-top:8px;color:var(--paper-ink)}
.today .sub{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--paper-dim);margin-top:8px;line-height:1.35}
.stepdots{display:flex;gap:6px;margin:16px 0 18px}
.stepdots i{flex:1;height:5px;border-radius:5px;background:rgba(42,28,35,.14)}
.stepdots i.on{background:var(--wine)}
.countdown{font-family:var(--display);font-size:54px;line-height:.9;color:var(--paper-ink);font-variant-numeric:tabular-nums;margin-top:8px}
.today .note{font-size:14.5px;margin-top:10px}
.card{border:1px solid var(--line);border-radius:6px;background:var(--night-2);padding:18px}
.card + .card{margin-top:12px}
.card h3{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25}
.card p{font-size:14px;color:var(--dim);margin-top:4px}
.card .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.stack{margin-top:14px}

/* phase map */
.phase{margin-top:22px}
.phase h3{font-family:var(--display);font-size:26px;letter-spacing:.04em;color:var(--pc);line-height:1}
.phase p.l{font-size:13.5px;color:var(--dim);margin:2px 0 10px}
.daylist{display:flex;flex-direction:column;gap:6px}
.dayrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line-soft);border-radius:6px;padding:11px 14px;background:var(--night-2);text-decoration:none;color:inherit}
.dayrow .n{font-family:var(--display);font-size:24px;color:var(--faint);line-height:1}
.dayrow b{font-weight:600;font-size:15px;line-height:1.3}
.dayrow .st{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.dayrow.done .n{color:var(--sage)} .dayrow.done .st{color:var(--sage)}
.dayrow.now{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 10%,var(--night-2))}
.dayrow.now .n,.dayrow.now .st{color:var(--pc)}
.dayrow.locked{opacity:.5}
.dayrow.locked b{filter:blur(3.5px);user-select:none}

.chart{padding:18px 16px 12px}
.chart svg{display:block;width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{border:1px solid var(--line-soft);border-radius:6px;padding:12px;background:var(--night-2)}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:.9;color:var(--pc);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:700}

/* ============ DAY ============ */
.dayhead{padding:22px 0 6px}
.back{font-size:13px;font-weight:700;color:var(--dim);text-decoration:none;display:inline-flex;gap:6px;align-items:center;background:none;border:none;cursor:pointer;padding:0}
.dayhead .eyebrow{margin-top:14px;color:var(--pc)}
.dayhead h1{font-size:clamp(62px,19vw,104px);margin-top:6px}
.dayhead .sub{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.4;color:var(--dim);margin-top:10px}
.ro{margin-top:12px;font-size:13px;color:var(--sage);font-weight:700}
.steps{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.step{border:1px solid var(--line);border-radius:6px;background:var(--night-2);overflow:hidden;transition:border-color .2s}
.step-h{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:16px 16px}
.step-n{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--faint)}
.step-h b{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2;display:block}
.step-h span{font-size:12.5px;color:var(--faint)}
.step-tag{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.step-b{padding:0 16px 20px}
.step.now{border-color:var(--pc)}
.step.now .step-n{border-color:var(--pc);color:var(--pc)}
.step.done .step-n{background:var(--sage);border-color:var(--sage);color:#13241a}
.step.done .step-tag{color:var(--sage)}
.step.locked{opacity:.55}
.step.locked .step-b{display:none}
.lesson p{font-family:var(--serif);font-size:18px;line-height:1.6;margin-bottom:14px}
.his{margin:6px 0 16px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.his-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:var(--night-3);border:none;cursor:pointer;text-align:left}
.his-h b{font-family:var(--display);font-size:21px;letter-spacing:.05em;color:var(--candle);font-weight:400}
.his-h span{font-size:12px;color:var(--faint)}
.his-b{padding:16px 18px 18px;transform:rotate(-.4deg);margin:10px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.his-b .hand{font-size:23px;color:var(--wine)}
.his-b .from{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:4px}
.textback{margin-top:4px;border-left:2px solid var(--pc);padding:4px 0 4px 12px}
.textback h4{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.textback p{font-family:var(--serif);font-size:16px;line-height:1.45}
.textback button{margin-top:6px}

.w{border-top:1px dashed var(--line);padding-top:16px;margin-top:16px}
.w:first-child{border-top:none;padding-top:0;margin-top:0}
.w-q{font-family:var(--serif);font-size:17px;line-height:1.45;margin-bottom:12px}
.w-done{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);margin-top:10px;display:flex;gap:6px;align-items:center}
.w-need{font-size:12.5px;color:var(--faint);margin-top:8px}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:13px 14px;border:1px solid var(--line-soft);border-radius:6px;background:var(--night);cursor:pointer;font-size:15px;line-height:1.45;text-align:left;width:100%}
.chk i{width:22px;height:22px;border:1.5px solid var(--dim);border-radius:5px;display:grid;place-items:center;margin-top:1px}
.chk[aria-pressed="true"] i{background:var(--sage);border-color:var(--sage)}
.chk[aria-pressed="true"] i::after{content:"";width:6px;height:11px;border:solid #13241a;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk[aria-pressed="true"] span{color:var(--dim)}

/* ---------- widgets ---------- */
function wv(n, id){ return D(n).w[id]; }

function wDone(n, w){
  var v = wv(n, w.id);
  switch (w.t) {
    case "check": return !!v && w.items.every(function(_, i){ return v[i]; });
    case "pick": return Array.isArray(v) && v.length >= (w.min||1);
    case "lines": return Array.isArray(v) && v.filter(function(x){ return String(x||"").trim().length > 1; }).length >= (w.min||w.n);
    case "rows": return Array.isArray(v) && v.filter(function(r){ return r && w.cols.every(function(_, c){ return String(r[c]||"").trim().length > 1; }); }).length >= (w.min||1);
    case "text": return words(v) >= (w.minWords || 3);
    case "breath": case "seq": case "confirm": case "sos": case "review": return !!(v && v.done);
    case "timer": return !!(v && (v.done || (v.start && Date.now() - v.start >= w.secs*1000)));
    case "ncstart": return !!(L.st && L.st.nc_start);
    case "sign": return !!(v && sentence(v.letter) && String(v.name||"").trim().length > 1);

  }
  return true;
}

function breathe(n, id){
  var d = dayContent(n), w = (d.act||[]).concat(d.prac||[]).filter(function(x){ return x.id === id; })[0];
  if (!w) return;

  var key = n + "-" + id, c = document.querySelector('[data-bc="' + key + '"]'), sayEl = document.querySelector('[data-bs="' + key + '"]'), cnt = document.querySelector('[data-bn="' + key + '"]');

  var phases = [["breathe in", w.pattern[0], 1], ["hold", w.pattern[1], 1], ["breathe out", w.pattern[2], .55], ["hold", w.pattern[3], .55]].filter(function(p){ return p[1] > 0; });
  var cycle = 0, pi = 0;
  breathRun = {};
  (function step(){
    if (!document.body.contains(c)) { breathRun = null; return; }
    if (pi >= phases.length) { pi = 0; cycle++; }
    if (cycle >= w.cycles) {
      c.style.transitionDuration = "1.2s"; c.style.transform = "scale(.55)"; c.querySelector("span").textContent = "✓";
      setW(n, id, {done:true}); breathRun = null; setTimeout(function(){ refreshW(n, id); }, 900); return;
    }

    c.querySelector("span").innerHTML = '<small>' + p[0] + '</small>' + p[1];

  var a = e.target.closest && e.target.closest("a[data-track]");
  if (!a || !L.auth) return;
  queue("click", {target:a.getAttribute("data-track"), where:a.getAttribute("data-where") || route().sub || "today", day:L.st ? L.st.current : 0});
}, true);
document.addEventListener("submit", function(e){
  var f = e.target.getAttribute("data-form"); if (!f) return;
  e.preventDefault();
  if (f === "unlock") onUnlock(e.target); else if (f === "verify") onVerify(e.target);
});
var saveT = null;
document.addEventListener("input", function(e){
  var t = e.target, kind = t.getAttribute("data-in"); if (!kind) return;
  var n = Number(t.getAttribute("data-n")), id = t.getAttribute("data-w"), s = n ? D(n) : null;
  if (kind === "j") { var k = Number(t.getAttribute("data-k")); s.j = s.j || []; s.j[k] = t.value; }
  else if (kind === "line") { var v = (wv(n, id) || []).slice(); v[Number(t.getAttribute("data-i"))] = t.value; s.w[id] = v; }
  else if (kind === "row") { var rv = (wv(n, id) || []).map(function(r){ return (r||[]).slice(); }), r = Number(t.getAttribute("data-r")), c = Number(t.getAttribute("data-c")); while (rv.length <= r) rv.push([]); rv[r][c] = t.value; s.w[id] = rv; }
  else if (kind === "text") { s.w[id] = t.value; var need = document.querySelector('[data-need="' + id + '"]'); if (need) need.textContent = words(t.value) >= (findW(n,id).minWords||3) ? "" : "at least " + (findW(n,id).minWords||3) + " words. only on this phone."; }
  else if (kind === "sign") { var sv = Object.assign({}, wv(n, id) || {}); sv[t.getAttribute("data-f")] = t.value; s.w[id] = sv; }
  else if (kind === "space") { s.ci = s.ci || {}; s.ci.space = Number(t.value); var val = $("ci-val-" + n); if (val) { val.textContent = t.value; val.classList.remove("unset"); } }
  else if (kind === "sosi") { sosState.i = Number(t.value); var sv2 = $("sos-v"); sv2.textContent = t.value; sv2.classList.remove("unset"); $("sos-save").disabled = !(sosState.i != null && sosState.out); return; }
  clearTimeout(saveT); saveT = setTimeout(save, 300);
  if (n) {
    chrome(n);
    if (kind === "line" || kind === "row" || kind === "sign" || kind === "text") {
      var box = $("w-" + n + "-" + id), w = findW(n, id), done = wDone(n, w);
      if (box) { var dn = box.querySelector(".w-done"), nd = box.querySelector(".w-need"); if (done && !dn) { if (nd) nd.remove(); box.insertAdjacentHTML("beforeend", '<div class="w-done">✓ done</div>'); } else if (!done && dn) { dn.remove(); } }
    }
    if (kind === "j") { /* show burn button once the letter has a sentence */
      var d = dayContent(n); if (d && d.burn && Number(t.getAttribute("data-k")) === 0 && sentence(t.value) && !document.querySelector('[data-act="burn"]')) { t.closest(".prompt").insertAdjacentHTML("afterend", '<div style="margin:-6px 0 14px"><button class="btn btn-ghost" data-act="burn" data-n="' + n + '">burn the letter</button> <span class="faint" style="font-size:12.5px">when you\'re ready. deletes it for good.</span></div>'); }
    }
  }
});
document.addEventListener("change", function(e){ if (e.target.getAttribute("data-in") === "space") save(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && $("ov").innerHTML) { closeOv(); } });
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible" && L.auth) {
    flush();
    var before = L.st ? L.st.current_open + ":" + L.st.done : "";
    refresh().then(function(r){ if (r && r.ok && (L.st.current_open + ":" + L.st.done) !== before && !$("ov").innerHTML) render(); });
  }
});

/* ================= home-screen handoff (iphone) =================
   the home-screen app can't see safari's storage, so while she's signed in here,
   safari's address carries a one-time link. "add to home screen" saves that address. */
function handoffPrep(){
  if (!L.auth || !isIOS || standalone() || inApp) return;
  var h = L.handoff;
  var put = function(code){ try { history.replaceState(null, "", "/upstairs/?h=" + code + location.hash); } catch(e){} };
  if (h && Date.now() - h.at < 25*DAY) { put(h.h); return; }
  api("handoff_new", {}).then(function(r){ if (r.ok && r.h) { L.handoff = {h:r.h, at:Date.now()}; save(); put(r.h); } });
}
function handoffUse(){
  var h = ""; try { h = new URLSearchParams(location.search).get("h") || ""; } catch(e){}
  if (!h) return Promise.resolve(false);
  if (L.auth) return Promise.resolve(false);
  return call({action:"handoff", product:PRODUCT, h:h, tz:TZ, ua:UA.slice(0,60)}).then(function(r){
    try { history.replaceState(null, "", "/upstairs/" + (location.hash || "#/" + PRODUCT)); } catch(e){}
    if (r.ok && r.token) { if (r.product) useProduct(r.product); L.auth = {email:r.email, token:r.token}; if (r.state) L.st = r.state; L.welcomed = true; save(); return true; }
    return false;
  });
}

/* ================= iphone home-screen app: screen repair =================
   after the app opens a link in apple's little in-app browser (reading room, stan),
   iOS sometimes comes back with the wrong screen size: top bar above the screen,
   tab bar in the corners. on every return we check, try a quick reset, and if that
   doesn't fix it, reload on the same screen (instant from the saved copy). */
var screenGuard = (function(){
  var on = isIOS && standalone(), base = null, timers = [], probe = null;
  function measure(){
    if (!probe) { probe = document.createElement("div"); probe.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)"; document.body.appendChild(probe); }
    var cs = getComputedStyle(probe);
    return {t:parseFloat(cs.paddingTop)||0, b:parseFloat(cs.paddingBottom)||0, h:window.innerHeight, w:window.innerWidth, sh:Math.max(screen.width, screen.height)};
  }
  function bad(m){
    if (Math.max(m.h, m.w) > m.sh + 1) return "taller than the screen";
    if (base && base.w === m.w) {
      if (Math.abs(m.h - base.h) > 2) return "height changed";
      if (m.t < base.t - 1 || m.b < base.b - 1) return "safe edges lost";
    }
    return "";
  }
  function soft(){
    try { window.scrollTo(0, 0); } catch(e){}
    var v = document.querySelector('meta[name="viewport"]');
    if (v) { var c = v.getAttribute("content"); v.setAttribute("content", c + ",maximum-scale=1"); setTimeout(function(){ v.setAttribute("content", c); }, 60); }
  }
  function hard(why){
    var last = 0; try { last = Number(sessionStorage.getItem("kp_fix_at")) || 0; } catch(e){}
    if (Date.now() - last < 20000) return;                  // never loop
    try { sessionStorage.setItem("kp_fix_at", String(Date.now())); sessionStorage.setItem("kp_fix_why", why); } catch(e){}
    save(); try { flush(); } catch(e){}
    location.reload();
  }
  function check(){
    if (!on) return;
    timers.forEach(clearTimeout); timers = [];
    timers.push(setTimeout(function(){
      if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;   // keyboard up: leave it alone
      var m = measure(), why = bad(m);
      if (!why) { if (!base || base.w !== m.w) base = m; return; }   // healthy (or rotated): remember it
      soft();
      timers.push(setTimeout(function(){ var w2 = bad(measure()); if (w2 && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) hard(w2); }, 450));
    }, 350));
  }
  if (on) {
    setTimeout(function(){ var m = measure(); if (!bad(m)) base = m; }, 400);
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") check(); });
    window.addEventListener("pageshow", check);
    window.addEventListener("focus", check);
  }
  return (window.__screenGuard = {check:check, measure:measure, bad:bad, base:function(){ return base; }});
})();

/* ================= boot ================= */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && !CONFIG.onesignalAppId) {
  navigator.serviceWorker.register("/upstairs/sw.js", {scope:"/upstairs/"}).catch(function(){});
}
pushBoot();
handoffUse().then(function(used){
  if (used) { location.hash = "#/" + PRODUCT; toast("you're in. this is your app now."); }
  if (L.auth && !location.hash) location.replace("#/" + PRODUCT);
  render();
  if (L.auth) { refresh().then(function(r){ if (r && r.ok && !$("ov").innerHTML && document.activeElement && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) render(); handoffPrep(); }); flush(); }
});
})();
